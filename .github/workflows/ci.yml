# CI backstop for the local gates. The husky hooks (pre-commit
# lint-staged, pre-push preflight + AI-attribution scan) are the first
# line, but hooks are bypassable (`git push --no-verify`, a clone where
# `pnpm install` never ran, GitHub-web commits). CI is the gate an
# agent can't route around.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight

  ai-attribution:
    # Re-runs scripts/scan-ai-attribution.sh against the PR's base so
    # attribution that slipped past (or around) the pre-push hook is
    # caught before it becomes PR-visible. Push-to-main runs skip this
    # job — there's no base range to scan.
    #
    # actions/checkout@v4, even with fetch-depth: 0, only unshallows
    # the checked-out ref's own history — it does NOT create
    # refs/remotes/origin/<base> for other branches. Without the
    # explicit fetch below, `origin/<base_ref>` never resolves locally
    # and the scan script (which treats an unresolvable base branch as
    # "nothing to scan, exit 0" for local/offline pushes) would pass
    # this job on every PR without ever scanning a commit. The fetch
    # step makes the ref resolvable; AI_ATTRIBUTION_STRICT=1 is the
    # second line of defense — if this step ever breaks, the scan
    # fails loudly instead of silently passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin "${{ github.base_ref }}"
      - run: bash scripts/scan-ai-attribution.sh
        env:
          PRE_PUSH_BASE_BRANCH: origin/${{ github.base_ref }}
          AI_ATTRIBUTION_STRICT: '1'
