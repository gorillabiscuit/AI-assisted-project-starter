# CI backstop for the local gates. The husky hooks (pre-commit
# lint-staged, pre-push preflight + AI-attribution scan) are the first
# line, but hooks are bypassable (`git push --no-verify`, a clone where
# `pnpm install` never ran, GitHub-web commits). CI is the gate an
# agent can't route around.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm preflight

  dependency-audit:
    # Third gate class: known-vulnerable dependencies. The quality gates
    # (preflight) catch code we wrote; this catches code we imported.
    # `pnpm audit` checks the lockfile against the npm advisory DB —
    # no third-party action, no token, nothing to configure.
    #
    # --audit-level=high: fail on high/critical only. Moderate advisories
    # in dev tooling are near-constant background noise; a gate that cries
    # wolf gets `continue-on-error`d within a month and then protects
    # nothing. If a high finding is a true false-positive for this
    # project, add a documented override in package.json
    # (pnpm.auditConfig.ignoreCves) in its own reviewed commit — never
    # loosen the level here.
    #
    # Projects with stricter needs (SBOMs, license policy, transitive
    # reachability) should graduate to osv-scanner or socket.dev via an
    # ADR — see docs/adr/QUEUE.md "Deployment pipeline" entry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # deploy (intentionally absent — this is a slot, not an implementation)
  #
  # The starter is deploy-target-agnostic: a Vercel app, an AWS CDK stack,
  # an npm package, and a static site all deploy differently, and shipping
  # any one of them here would tax every project that chose another.
  # What generalises is the PATTERN, so new projects should add it early
  # (it's a seeded decision in docs/adr/QUEUE.md → "Deployment pipeline"):
  #
  #   deploy-staging:
  #     needs: [preflight, dependency-audit]     # quality gates block deploys
  #     if: github.ref == 'refs/heads/main'      # staging tracks main
  #     ...platform-specific steps...
  #
  #   deploy-production:
  #     needs: [preflight, dependency-audit]
  #     if: startsWith(github.ref, 'refs/tags/') # prod is an explicit act:
  #     environment: production                  # tag + GitHub environment
  #     ...platform-specific steps...            # approval, never a side
  #                                              # effect of merging
  #
  # Rules that hold on every platform: deploys depend on ALL gate jobs;
  # staging is continuous, production is deliberate; rollback is a
  # documented runbook (docs/runbooks/) before the first prod deploy,
  # not after the first bad one.

  ai-attribution:
    # Re-runs scripts/scan-ai-attribution.sh against the PR's base so
    # attribution that slipped past (or around) the pre-push hook is
    # caught before it becomes PR-visible. Push-to-main runs skip this
    # job — there's no base range to scan.
    #
    # actions/checkout@v4, even with fetch-depth: 0, only unshallows
    # the checked-out ref's own history — it does NOT create
    # refs/remotes/origin/<base> for other branches. Without the
    # explicit fetch below, `origin/<base_ref>` never resolves locally
    # and the scan script (which treats an unresolvable base branch as
    # "nothing to scan, exit 0" for local/offline pushes) would pass
    # this job on every PR without ever scanning a commit. The fetch
    # step makes the ref resolvable; AI_ATTRIBUTION_STRICT=1 is the
    # second line of defense — if this step ever breaks, the scan
    # fails loudly instead of silently passing.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin "${{ github.base_ref }}"
      - run: bash scripts/scan-ai-attribution.sh
        env:
          PRE_PUSH_BASE_BRANCH: origin/${{ github.base_ref }}
          AI_ATTRIBUTION_STRICT: '1'
